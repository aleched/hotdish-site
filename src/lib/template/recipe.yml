# Example Hotdish template, also used as the built-in default for repositories without one.
# Copy to `.hotdish/template.yml` in your repository to customize it. To opt out of templates
# entirely, commit an empty `.hotdish/template.yml`.
#
# Templates are advisory. They shape the editing form and constrain tag values, but they are
# never a storage format: documents stay plain markdown, and anything the template does not
# describe is preserved exactly as written.
#
# Field options: key, label, type (text, number, boolean, enum, multi-enum, url, date), required,
# options, allowCustom, icon (shown next to the field; see src/lib/ui/icon-names.ts).
# Wrap fields in group: (a list of fields) to show them on one line.

version: 1
name: Recipe

fields:
  - key: tags
    label: Tags
    type: multi-enum
    allowCustom: true
    options:
      - breakfast
      - dinner
      - dessert
      - vegetarian
      - quick
      - make-ahead

  # A group puts its fields on one line of the form.
  - group:
      - key: servings
        label: Servings
        type: text
        icon: person

      - key: prep_time
        label: Prep time
        type: text
        icon: bowl

      - key: cook_time
        label: Cook time
        type: text
        icon: flame

  - key: source
    label: Source
    type: url
    icon: link

sections:
  - id: ingredients
    heading: Ingredients
    type: list
    repeatable: true
    subheadingLabel: Component

  - id: instructions
    heading: Instructions
    type: ordered
    repeatable: true
    subheadingLabel: Stage

  - id: notes
    heading: Notes
    type: text
    optional: true
