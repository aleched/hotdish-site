<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="theme-color" content="#7b3fa0" />
		<script>
			try {
				var t = JSON.parse(localStorage.getItem('hotdish.theme.v1') || '{}');
				if (t.mode === 'light' || t.mode === 'dark') document.documentElement.dataset.theme = t.mode;
				if (t.accent && t.accent !== 'purple') document.documentElement.dataset.accent = t.accent;
			} catch (e) {}
		</script>		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
